[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tidarator"
dynamic = ["version"]
description = "A Python CLI app for managing Tidaro.com parking spot bookings."
authors = [{ name = "Gallus Anonymus", email = "Gallus.Anonymus@example.com" }]
dependencies = ["click", "python-dotenv", "requests", "yagmail"]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
]

[project.scripts]
tidarator = "tictl:cli"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0-dev"

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"

[tool.hatch.build.hooks.vcs]
version-file = "tidarator/_version.py"

[tool.hatch.metadata]
license = "Apache-2.0"
readme = "README.md"

[tool.hatch.build.targets.wheel]
include = ["tidarator/**", "tictl.py"]
exclude = ["**/__pycache__/**", "config.toml", "**/session_secrets", "**/*.log"]


[tool.hatch.envs.default]
python = "3.12"

[tool.hatch.envs.test]
dependencies = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
]

[tool.hatch.envs.test.scripts]
run = "pytest {args}"
cov = "pytest --cov=tidarator --cov=tictl --cov-report=term-missing {args}"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
